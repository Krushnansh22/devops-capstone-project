[tool:pytest]
testpaths = tests
addopts = -q
python_files = test_*.py

[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-erase=1
cover-package=service
cover-html=1

[coverage:report]
show_missing = True

[flake8]
max-line-length = 127
per-file-ignores =
    */__init__.py: F401 E402

[pylint]
disable=E1101
